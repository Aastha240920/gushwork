<!doctype html>
<html>
  <head>
    <title>Store</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h2>Gushwork Store</h2>
    </header>

    <section class="container">
      <div class="gallery">
        <div class="main-image">
          <img id="mainImage" src="images/img1.jpg" />
        </div>

        <div class="carousel-wrapper">
          <button id="prev">⬅</button>

          <div class="carousel" id="carousel">
            <img src="images/img1.jpg" class="thumb" />
            <img src="images/img2.jpg" class="thumb" />
            <img src="images/img3.jpg" class="thumb" />
            <img src="images/img1.jpg" class="thumb" />
            <img src="images/img4.jpg" class="thumb" />
            <img src="images/img5.jpg" class="thumb" />
            <img src="images/img6.jpg" class="thumb" />
          </div>

          <button id="next">➡</button>
        </div>
      </div>

      <div class="details">
        <h1>Product Name</h1>
        <p class="price">₹1999</p>
        <p>Some description about the product.</p>
        <button>Add to Cart</button>
      </div>
    </section>

    <script src="normal.js"></script>
  </body>
</html>
